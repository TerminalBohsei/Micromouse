; Open THIS folder in local Visual Studio Code with PlatformIO IDE installed.
; This baseline assumes a classic ESP32 development board with 4 MB flash.
; Verify the actual board before uploading; this is not an ESP32-C3/S3 pin map.
[platformio]
default_envs = micromouse

[env:micromouse]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_speed = 115200

; Pin dependencies for repeatable team builds. The Pololu L1X library is required.
lib_deps =
    adafruit/Adafruit_VL53L0X@1.2.4
    pololu/VL53L1X@1.3.1
lib_ldf_mode = deep+

; Matches Serial.begin(115200) in the firmware.
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
monitor_dtr = 0
monitor_rts = 0

; Optional: uncomment ONLY after finding your board's port with pio device list.
; upload_port = COM4
; monitor_port = COM4
