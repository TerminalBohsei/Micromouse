; Open THIS folder in VS Code with the PlatformIO IDE extension.
; Arduino IDE users: open firmware/Micromouse/Micromouse.ino instead (see README).
[platformio]
src_dir = firmware/Micromouse
default_envs = micromouse

[env:micromouse]
platform = platformio/espressif32@6.12.0     ; Arduino-ESP32 core 2.0.17 (3.x also builds)
board = esp32dev                             ; classic ESP32 (the WROVER-IE DevKit)
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_dtr = 0                              ; stop the serial monitor resetting the board
monitor_rts = 0
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1
lib_ldf_mode = deep+
build_flags = -Wall
